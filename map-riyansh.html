<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Satellite Navigation</title>
    
    <!-- Tailwind CSS for Premium UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet JS & CSS for High-Performance Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }

        /* Glassmorphism Control Panel */
        #control-panel {
            position: absolute;
            top: 20px; left: 20px;
            width: 380px; max-height: calc(100vh - 40px);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            z-index: 1000;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        #control-panel::-webkit-scrollbar { width: 6px; }
        #control-panel::-webkit-scrollbar-track { background: transparent; }
        #control-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .input-dark {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 10px;
            padding: 10px 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-dark:focus { border-color: var(--accent); }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; font-weight: 600;
            padding: 12px; border-radius: 10px; border: none;
            cursor: pointer; transition: transform 0.1s, opacity 0.2s;
            text-align: center; width: 100%;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 8px 12px; border-radius: 8px;
            cursor: pointer; transition: background 0.2s; font-size: 0.85rem;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-secondary.active { background: var(--accent); border-color: var(--accent); }

        .car-marker {
            width: 40px; height: 40px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233b82f6" stroke="white" stroke-width="1.5"><path d="M5 11l1.5-4.5h11L19 11v6h-1v-2H6v2H5v-6zM7.5 7h9l1 3h-11l1-3z"/><circle cx="7.5" cy="14.5" r="1.5" fill="white"/><circle cx="16.5" cy="14.5" r="1.5" fill="white"/></svg>');
            background-size: cover;
            transition: transform 0.1s linear;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        .poi-marker {
            width: 30px; height: 30px;
            background-color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border: 2px solid #3b82f6;
        }

        /* Results Panel */
        .results-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .result-card {
            background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 10px;
            border-left: 3px solid var(--accent);
        }
        .result-card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        .result-card .value { font-size: 1.1rem; font-weight: bold; color: #fff; margin-top: 2px; }
        .result-card .value.highlight { color: #10b981; } /* Green */
        .result-card .value.warning { color: #ef4444; } /* Red for heavy traffic */

        /* Toast Notification */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 30px; border: 1px solid var(--glass-border);
            z-index: 2000; display: none; backdrop-filter: blur(10px);
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6;
            border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Bottom Sheet & Active Nav Styles */
        .setup-ui { display: flex; }
        .active-ui { display: none; flex-direction: column; }
        
        #control-panel.nav-active {
            top: auto; bottom: 0; left: 0; width: 100%;
            max-height: 55vh;
            border-radius: 24px 24px 0 0;
            padding: 15px 20px 30px 20px;
            transform: translateY(0);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 23, 42, 0.95); /* Darker solid background for active nav */
        }
        
        #control-panel.nav-active .setup-ui { display: none; }
        #control-panel.nav-active .active-ui { display: flex; }
        #control-panel.nav-active #drag-handle { display: block; }

        @media (min-width: 768px) {
            #control-panel.nav-active {
                top: 20px; bottom: auto; left: 20px; width: 380px; max-height: calc(100vh - 40px);
                border-radius: 20px; padding: 20px;
            }
            #control-panel.nav-active #drag-handle { display: none; }
        }
    </style>
</head>
<body>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- UI Overlay -->
    <div id="control-panel" class="p-5">
        
        <div id="drag-handle" class="hidden w-12 h-1.5 bg-gray-500 rounded-full mx-auto mb-3 opacity-50"></div>
        
        <div class="setup-ui w-full flex-col">
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-700">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    Nexus Engine
                </h1>
                <div id="auth-status" class="text-xs text-green-400 bg-green-400/10 px-2 py-1 rounded-full flex items-center gap-1">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    Cloud Syncing
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="flex gap-2 mb-4 bg-black/40 p-1 rounded-xl">
                <button class="flex-1 btn-secondary active flex justify-center items-center gap-2" onclick="setMode('car', this)">
                    🚗 Car
                </button>
                <button class="flex-1 btn-secondary flex justify-center items-center gap-2" onclick="setMode('bike', this)">
                    🏍️ Bike
                </button>
                <button class="flex-1 btn-secondary flex justify-center items-center gap-2" onclick="setMode('walk', this)">
                    🚶 Walk
                </button>
            </div>

            <!-- Routing Inputs -->
            <div class="flex flex-col gap-3 mb-4">
                <div>
                    <label class="text-xs text-gray-400 uppercase tracking-wider ml-1">Start Location</label>
                    <div class="flex gap-2 mt-1">
                        <input type="text" id="start-input" class="input-dark flex-1" placeholder="Current Location or Address">
                        <button class="btn-secondary" onclick="useCurrentLocation()" title="Use GPS">📍</button>
                    </div>
                </div>

                <!-- Stops Container -->
                <div id="stops-container" class="flex flex-col gap-2"></div>
                <button class="text-xs text-blue-400 hover:text-blue-300 text-left w-fit ml-1 font-medium transition" onclick="addStop()">+ Add Stop</button>

                <div>
                    <label class="text-xs text-gray-400 uppercase tracking-wider ml-1">Destination</label>
                    <input type="text" id="dest-input" class="input-dark mt-1" placeholder="Enter target landmark...">
                </div>

                <div id="vehicle-setup">
                    <label class="text-xs text-gray-400 uppercase tracking-wider ml-1">Vehicle Model & Fuel Config</label>
                    <select id="vehicle-model" class="input-dark mt-1">
                        <option value="hatchback">Hatchback / Compact (18 km/L)</option>
                        <option value="sedan" selected>Sedan / Standard (13 km/L)</option>
                        <option value="suv">SUV / Heavy (9 km/L)</option>
                    </select>
                </div>
            </div>

            <button id="start-btn" class="btn-primary mb-6 flex justify-center items-center gap-2" onclick="processNavigation()">
                Start Live Navigation
            </button>

            <!-- Dynamic Results Dashboard -->
            <div id="results-panel" class="hidden flex-col gap-4 mb-6">
                <h3 class="text-sm font-semibold border-b border-gray-700 pb-2 text-gray-300">Live Telemetry & Estimates</h3>
                
                <div class="results-grid">
                    <div class="result-card">
                        <div class="label">True Duration (Traffic)</div>
                        <div class="value warning" id="res-time">-- mins</div>
                    </div>
                    <div class="result-card" style="border-color: #10b981;">
                        <div class="label">Arrival (IST)</div>
                        <div class="value highlight" id="res-eta">--:--</div>
                    </div>
                    <div class="result-card">
                        <div class="label">Distance</div>
                        <div class="value" id="res-dist">-- km</div>
                    </div>
                    <div class="result-card">
                        <div class="label">Avg Speed</div>
                        <div class="value" id="res-speed">-- km/h</div>
                    </div>
                </div>

                <div class="results-grid mt-[-5px]">
                    <div class="result-card" style="border-color: #f59e0b;">
                        <div class="label">Est. Fuel Cost (₹104/L)</div>
                        <div class="value" style="color: #fbd38d;" id="res-fuel">₹0.00</div>
                    </div>
                    <div class="result-card" style="border-color: #f59e0b;">
                        <div class="label">Toll Gates Estimate</div>
                        <div class="value" style="color: #fbd38d;" id="res-tolls">₹0.00</div>
                    </div>
                </div>
            </div>

            <!-- Cloud Saved Places -->
            <div class="border-t border-gray-700 pt-4 mt-auto">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-xs text-gray-400 uppercase tracking-wider ml-1">Cloud Saved Places</label>
                    <button class="text-xs text-blue-400 hover:text-blue-300" onclick="toggleSaveMenu()">+ Save New</button>
                </div>
                
                <!-- Save New Place Menu -->
                <div id="save-menu" class="hidden flex-col gap-2 mb-3 bg-black/40 p-3 rounded-lg border border-gray-700">
                    <input type="text" id="save-title" class="input-dark text-sm py-2" placeholder="Title (e.g., Home, Beach)">
                    <input type="text" id="save-address" class="input-dark text-sm py-2" placeholder="Full Address">
                    <button class="btn-primary py-2 text-sm" onclick="savePlaceToCloud()">Save to Account</button>
                </div>

                <div id="saved-places-container" class="grid grid-cols-2 gap-2">
                    <!-- Populated by Firebase -->
                    <div class="text-xs text-gray-500 col-span-2 text-center py-2">Loading cloud data...</div>
                </div>
            </div>
            
            <!-- Recent Searches -->
            <div class="mt-4">
                 <label class="text-xs text-gray-400 uppercase tracking-wider ml-1">Recent Routes</label>
                 <div id="recent-routes-container" class="mt-2 flex flex-col gap-1 max-h-32 overflow-y-auto pr-2">
                     <!-- Populated by Firebase -->
                 </div>
            </div>
        </div> <!-- End of setup-ui -->

        <!-- Active Navigation UI (Hidden by default) -->
        <div class="active-ui w-full">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-4xl font-bold text-green-400" id="active-eta">--:--</h2>
                <div class="text-right">
                    <div class="text-xl text-white font-bold" id="active-time-dist">-- min</div>
                    <div class="text-sm text-gray-400" id="active-dist-only">-- km</div>
                </div>
            </div>
            <p class="text-xs text-gray-400 mb-4 pb-4 border-b border-gray-700" id="active-status">Navigating to destination...</p>
            
            <div id="active-results-container" class="mb-4"></div> <!-- Dynamic results holder -->

            <div class="flex gap-3 mt-auto">
                <button class="w-16 h-16 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center shadow-lg transition transform active:scale-95 mx-auto" onclick="exitNavigation()" title="Exit Navigation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>

    </div>

    <div id="toast">Message here</div>

    <!-- Firebase & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        window.currentMode = 'car';
        let map, carMarker, routeLines = [], poiMarkers = [];
        let navigationInterval;
        let currentUser = null;
        let db = null;
        const FUEL_PRICE = 104.21;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nexus-maps-default';
        let isUsingCurrentLocation = false; // Tracks if GPS is active

        // Disable live movement if user manually types an address
        document.addEventListener('DOMContentLoaded', () => {
            const startInput = document.getElementById('start-input');
            if(startInput) {
                startInput.addEventListener('input', () => {
                    isUsingCurrentLocation = false;
                });
            }
        });

        // 1. INITIALIZE MAP (Leaflet with Google Earth Hybrid Satellite Layer)
        function initMap() {
            // Center on Mumbai initially
            map = L.map('map', { zoomControl: false }).setView([19.0760, 72.8777], 12);
            
            // Move zoom control to top right to avoid UI overlap
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Google Hybrid Tile Layer (Satellite + Roads/Labels)
            L.tileLayer('http://mt0.google.com/vt/lyrs=y&hl=en&x={x}&y={y}&z={z}', {
                maxZoom: 21,
                attribution: '© Google Earth | Nexus Engine'
            }).addTo(map);
            
            showToast("Satellite map loaded.");
        }

        // 2. FIREBASE CLOUD SETUP
        async function initFirebase() {
            const authStatusEl = document.getElementById('auth-status');
            
            if (typeof __firebase_config === 'undefined') {
                if (authStatusEl) {
                    authStatusEl.innerHTML = 'Local Mode';
                    authStatusEl.className = 'text-xs text-gray-400 bg-gray-400/10 px-2 py-1 rounded-full';
                }
                return; // Fallback if no firebase env
            }

            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);

                // Strict Auth Protocol
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        if (authStatusEl) {
                            authStatusEl.innerHTML = '<div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div> Cloud Synced';
                        }
                        loadCloudData();
                    }
                });
            } catch (err) {
                console.error("Firebase Init Error:", err);
            }
        }

        // 3. CLOUD DATA MANAGEMENT
        function loadCloudData() {
            if (!currentUser || !db) return;

            // Load Saved Places
            const placesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'saved_places');
            onSnapshot(placesRef, (snapshot) => {
                const container = document.getElementById('saved-places-container');
                container.innerHTML = '';
                
                if(snapshot.empty) {
                    container.innerHTML = '<div class="text-xs text-gray-500 col-span-2">No saved places yet.</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const btn = document.createElement('button');
                    btn.className = 'btn-secondary flex items-center justify-between text-left truncate';
                    btn.innerHTML = `<span class="truncate">⭐ ${data.title}</span> <span class="text-red-400 hover:text-red-300 ml-2" onclick="event.stopPropagation(); deletePlace('${doc.id}')">×</span>`;
                    btn.onclick = () => {
                        document.getElementById('dest-input').value = data.address;
                        window.processNavigation();
                    };
                    container.appendChild(btn);
                });
            }, (err) => console.error(err));

            // Load Recent Routes
            const routesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'recent_routes');
            onSnapshot(routesRef, (snapshot) => {
                const container = document.getElementById('recent-routes-container');
                container.innerHTML = '';
                
                // Note: manual sorting in JS to avoid complex index requirements (Rule 2)
                let routes = [];
                snapshot.forEach(doc => routes.push({id: doc.id, ...doc.data()}));
                routes.sort((a,b) => b.timestamp - a.timestamp);
                routes = routes.slice(0, 5); // Limit 5

                routes.forEach(route => {
                    const div = document.createElement('div');
                    div.className = 'text-xs text-gray-400 p-2 bg-gray-800/50 rounded cursor-pointer hover:bg-gray-700/50 flex justify-between';
                    div.innerHTML = `<span class="truncate">${route.start} → ${route.dest}</span>`;
                    div.onclick = () => {
                        document.getElementById('start-input').value = route.start;
                        document.getElementById('dest-input').value = route.dest;
                        window.processNavigation();
                    };
                    container.appendChild(div);
                });
            }, (err) => console.error(err));
        }

        window.savePlaceToCloud = async () => {
            if (!currentUser || !db) return showToast("Cloud not connected.");
            const title = document.getElementById('save-title').value;
            const address = document.getElementById('save-address').value;
            if(!title || !address) return showToast("Enter title and address.");

            try {
                const placesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'saved_places');
                await addDoc(placesRef, { title, address, timestamp: Date.now() });
                document.getElementById('save-title').value = '';
                document.getElementById('save-address').value = '';
                document.getElementById('save-menu').classList.add('hidden');
                showToast("Place saved to cloud.");
            } catch(err) {
                console.error(err);
                showToast("Error saving place.");
            }
        };

        window.deletePlace = async (docId) => {
            if (!currentUser || !db) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'saved_places', docId));
            } catch(err) { console.error(err); }
        };

        async function saveRecentRoute(start, dest) {
            if (!currentUser || !db) return;
            try {
                const routesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'recent_routes');
                await addDoc(routesRef, { start, dest, timestamp: Date.now() });
            } catch(err) { console.error(err); }
        }

        // 4. UI INTERACTIONS
        window.setMode = (mode, btn) => {
            window.currentMode = mode;
            document.querySelectorAll('.btn-secondary').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Toggle vehicle setup visibility
            const vehicleSetup = document.getElementById('vehicle-setup');
            if (mode === 'car') {
                vehicleSetup.style.display = 'block';
            } else {
                vehicleSetup.style.display = 'none';
            }
        };

        window.toggleSaveMenu = () => {
            const menu = document.getElementById('save-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        };

        window.addStop = () => {
            const container = document.getElementById('stops-container');
            const div = document.createElement('div');
            div.className = "flex gap-2";
            div.innerHTML = `
                <input type="text" class="input-dark flex-1 stop-input text-sm py-2" placeholder="Waypoint address...">
                <button class="btn-secondary" onclick="this.parentElement.remove()" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #f87171;">×</button>
            `;
            container.appendChild(div);
        };

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        };

        window.useCurrentLocation = () => {
            if (navigator.geolocation) {
                showToast("Acquiring GPS Signal...");
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    document.getElementById('start-input').value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                    isUsingCurrentLocation = true; // Flag for Live Navigation
                    showToast("GPS Locked.");
                    map.flyTo([lat, lon], 16);
                }, () => showToast("GPS Permission Denied."));
            }
        };

        // 5. CORE NAVIGATION ENGINE (Geocoding & Routing)
        async function geocode(query) {
            // Fallback for coordinates
            if (query.match(/^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/)) {
                const parts = query.split(',');
                return [parseFloat(parts[1]), parseFloat(parts[0])]; // Return [lon, lat] for OSRM
            }

            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
            const data = await res.json();
            if (data && data.length > 0) {
                return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
            }
            throw new Error(`Could not find location: ${query}`);
        }

        window.processNavigation = async () => {
            const startInput = document.getElementById('start-input').value;
            const destInput = document.getElementById('dest-input').value;
            const btn = document.getElementById('start-btn');

            if (!startInput || !destInput) return showToast("Enter Start and Destination");

            btn.innerHTML = '<div class="loader"></div> Calculating Route...';
            btn.disabled = true;

            try {
                // 1. Geocode Start, Stops, and Destination
                const startCoords = await geocode(startInput);
                const destCoords = await geocode(destInput);
                
                const stopInputs = document.querySelectorAll('.stop-input');
                let stopsCoords = [];
                for (let input of stopInputs) {
                    if (input.value) stopsCoords.push(await geocode(input.value));
                }

                const allPoints = [startCoords, ...stopsCoords, destCoords];
                const coordinatesString = allPoints.map(c => `${c[0]},${c[1]}`).join(';');

                // 2. Fetch Route Geometry (OSRM)
                // Use profile based on mode
                let profile = 'driving';
                if (window.currentMode === 'bike') profile = 'driving'; // OSRM default doesn't have bike everywhere, driving is safe base
                if (window.currentMode === 'walk') profile = 'foot';

                const osrmUrl = `https://router.project-osrm.org/route/v1/${profile}/${coordinatesString}?overview=full&geometries=geojson`;
                const routeRes = await fetch(osrmUrl);
                const routeData = await routeRes.json();

                if (routeData.code !== 'Ok') throw new Error("Routing failed.");

                const route = routeData.routes[0];
                const coordinates = route.geometry.coordinates; // Array of [lon, lat]
                const baseDistanceKm = route.distance / 1000;
                
                // 3. Apply Mumbai Contextual Traffic & Calculations
                calculateAndDisplayMetrics(baseDistanceKm, window.currentMode);

                // 4. Render on Map
                renderRouteOnMap(coordinates);

                // 5. Save to Recents
                saveRecentRoute(startInput, destInput);

                // 6. UI Transition to Google Maps Style Bottom Sheet
                document.getElementById('control-panel').classList.add('nav-active');
                
                // Move results panel into the active container
                const resultsPanel = document.getElementById('results-panel');
                document.getElementById('active-results-container').appendChild(resultsPanel);
                resultsPanel.classList.remove('hidden');
                resultsPanel.classList.add('flex');

                // 7. Start Simulation only if using GPS
                if (isUsingCurrentLocation) {
                    document.getElementById('active-status').innerText = "Live tracking active. Proceeding along route.";
                    startLiveSimulation(coordinates);
                } else {
                    document.getElementById('active-status').innerText = "Previewing Route (Location is not GPS)";
                    showToast("Preview Mode. Map is frozen. Use 'GPS' for live moving view.");
                }

            } catch (err) {
                console.error(err);
                showToast(err.message);
            } finally {
                btn.innerHTML = 'Start Live Navigation';
                btn.disabled = false;
            }
        };

        function calculateAndDisplayMetrics(distanceKm, mode) {
            document.getElementById('results-panel').classList.remove('hidden');
            document.getElementById('results-panel').classList.add('flex');

            let speedKmH = 0;
            let practicalTimeMins = 0;

            // Mumbai Practical Traffic Logic
            // Based on user prompt: 12.9km from Juhu to Malad is ~30mins (not 13mins)
            // This means average city speed is roughly 20-25 km/h for cars
            if (mode === 'car') {
                speedKmH = 22; // Mumbai average traffic speed
                practicalTimeMins = (distanceKm / speedKmH) * 60;
                practicalTimeMins += 4; // Congestion penalty
                practicalTimeMins += 2; // Road closure / buffer padding required by prompt
            } else if (mode === 'bike') {
                speedKmH = 30; // Bikes weave through traffic faster
                practicalTimeMins = (distanceKm / speedKmH) * 60;
                practicalTimeMins += 1; // Slight buffer
            } else if (mode === 'walk') {
                speedKmH = 4.5;
                practicalTimeMins = (distanceKm / speedKmH) * 60;
            }

            practicalTimeMins = Math.round(practicalTimeMins);

            // Calculate IST Arrival Time
            let arrivalTime = new Date();
            arrivalTime.setMinutes(arrivalTime.getMinutes() + practicalTimeMins);
            let options = { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' };
            let istTime = arrivalTime.toLocaleTimeString('en-IN', options);

            // Financial Calculations
            let fuelCost = 0;
            let tolls = 0;

            if (mode === 'car') {
                const vehicleType = document.getElementById('vehicle-model').value;
                let mileage = 13; // default sedan
                if (vehicleType === 'hatchback') mileage = 18;
                if (vehicleType === 'suv') mileage = 9;
                fuelCost = (distanceKm / mileage) * FUEL_PRICE;

                // Toll estimation logic (simulate Mumbai entry/sealink if distance is long)
                if (distanceKm > 15) tolls = 45; // Mumbai Entry Point Toll
                if (distanceKm > 30) tolls = 85 + 45; // Assuming Sea link + Entry
            } else if (mode === 'bike') {
                fuelCost = (distanceKm / 45) * FUEL_PRICE; // Avg bike mileage
                tolls = 0; // Bikes usually toll free
            }

            // Update UI Dashboard
            const timeEl = document.getElementById('res-time');
            timeEl.innerText = `${practicalTimeMins} mins`;
            // Color code time based on severity
            if (practicalTimeMins > 45) { timeEl.className = 'value warning'; }
            else if (practicalTimeMins > 20) { timeEl.className = 'value'; timeEl.style.color = '#fbd38d'; }
            else { timeEl.className = 'value highlight'; }

            document.getElementById('res-eta').innerText = `${istTime} IST`;
            document.getElementById('res-dist').innerText = `${distanceKm.toFixed(1)} km`;
            document.getElementById('res-speed').innerText = `${speedKmH.toFixed(1)} km/h`;
            document.getElementById('res-fuel').innerText = mode === 'walk' ? '₹0.00' : `₹${fuelCost.toFixed(2)}`;
            document.getElementById('res-tolls').innerText = `₹${tolls.toFixed(2)}`;
            
            // Update Active Navigation Summary Header
            document.getElementById('active-eta').innerText = istTime;
            document.getElementById('active-time-dist').innerText = `${practicalTimeMins} min`;
            document.getElementById('active-dist-only').innerText = `${distanceKm.toFixed(1)} km`;
        }

        function renderRouteOnMap(coordinates) {
            // Clear existing
            routeLines.forEach(line => map.removeLayer(line));
            routeLines = [];
            if (carMarker) map.removeLayer(carMarker);
            poiMarkers.forEach(m => map.removeLayer(m));
            poiMarkers = [];
            if(navigationInterval) clearInterval(navigationInterval);

            // Convert [lon, lat] from OSRM to [lat, lon] for Leaflet
            const latLngs = coordinates.map(c => [c[1], c[0]]);

            // Create Multi-colored segments to simulate "Live Traffic" overlay
            // We break the array into chunks and assign colors (Blue=Clear, Orange=Slow, Red=Jam)
            const chunkSize = Math.max(5, Math.floor(latLngs.length / 10));
            
            for (let i = 0; i < latLngs.length - 1; i += chunkSize) {
                const segment = latLngs.slice(i, i + chunkSize + 1);
                
                // Random traffic simulation
                const rand = Math.random();
                let color = '#3b82f6'; // Clear (Blue)
                let weight = 6;
                if (window.currentMode === 'car') {
                    if (rand > 0.85) { color = '#ef4444'; weight = 7; } // Red (Heavy)
                    else if (rand > 0.6) { color = '#f59e0b'; } // Orange (Moderate)
                }

                const pl = L.polyline(segment, {
                    color: color,
                    weight: weight,
                    opacity: 0.8,
                    lineJoin: 'round'
                }).addTo(map);
                routeLines.push(pl);
            }

            // Fit bounds to show entire route initially
            map.fitBounds(L.polyline(latLngs).getBounds(), { padding: [50, 50] });
            
            return latLngs;
        }

        function startLiveSimulation(osrmCoordinates) {
            const latLngs = osrmCoordinates.map(c => [c[1], c[0]]);
            const startPoint = latLngs[0];

            // 1. Initial Zoom Effect (Zooms in deeply before starting movement)
            setTimeout(() => {
                map.flyTo(startPoint, 18, { animate: true, duration: 2 });
                
                // Add simulated nearby POIs
                setTimeout(() => addSimulatedPOIs(startPoint), 2000);
            }, 500);

            // Create Custom Car Marker
            const iconHTML = `<div class="car-marker" id="live-car"></div>`;
            const customIcon = L.divIcon({ html: iconHTML, className: '', iconSize: [40, 40], iconAnchor: [20, 20] });
            
            carMarker = L.marker(startPoint, { icon: customIcon, zIndexOffset: 1000 }).addTo(map);

            // 2. Begin Movement Loop
            let currentIndex = 0;
            // Map animation interval (moves smoothly point by point)
            setTimeout(() => {
                navigationInterval = setInterval(() => {
                    if (currentIndex >= latLngs.length - 1) {
                        clearInterval(navigationInterval);
                        showToast("Destination Reached!");
                        document.getElementById('active-status').innerText = "Arrived at destination.";
                        return;
                    }

                    currentIndex++;
                    const nextPoint = latLngs[currentIndex];
                    const prevPoint = latLngs[currentIndex - 1];
                    
                    // Move Marker
                    carMarker.setLatLng(nextPoint);
                    
                    // Calculate bearing to rotate car icon
                    const bearing = calculateBearing(prevPoint[0], prevPoint[1], nextPoint[0], nextPoint[1]);
                    const carDiv = document.getElementById('live-car');
                    if(carDiv) {
                        carDiv.style.transform = `rotate(${bearing}deg)`;
                    }

                    // Keep map centered on car in high zoom (Map moves with vehicle)
                    map.panTo(nextPoint, { animate: true, duration: 0.2 });

                }, 400); // Speed of simulation
            }, 3000); // Wait for initial zoom flyTo to finish
        }

        window.exitNavigation = () => {
            if(navigationInterval) clearInterval(navigationInterval);
            
            // Close bottom sheet
            document.getElementById('control-panel').classList.remove('nav-active');
            
            // Revert DOM structure
            const setupResultsTarget = document.getElementById('start-btn');
            const resultsPanel = document.getElementById('results-panel');
            setupResultsTarget.parentNode.insertBefore(resultsPanel, setupResultsTarget.nextSibling);
            
            resultsPanel.classList.add('hidden');
            resultsPanel.classList.remove('flex');
            
            // Clear Route and Reset Camera
            routeLines.forEach(line => map.removeLayer(line));
            routeLines = [];
            if (carMarker) map.removeLayer(carMarker);
            poiMarkers.forEach(m => map.removeLayer(m));
            poiMarkers = [];
            map.setView([19.0760, 72.8777], 12); // Revert to Overview
            
            isUsingCurrentLocation = false;
        };

        function addSimulatedPOIs(centerCoord) {
            // Add a hospital and petrol pump slightly offset from start
            const offsets = [
                { lat: 0.001, lng: 0.001, icon: '🏥', title: 'City Hospital' },
                { lat: -0.001, lng: -0.0015, icon: '⛽', title: 'Bharat Petroleum' },
                { lat: 0.0015, lng: -0.0005, icon: '☕', title: 'Cafe' }
            ];

            offsets.forEach(off => {
                const poiIcon = L.divIcon({ html: `<div class="poi-marker" title="${off.title}">${off.icon}</div>`, className: '', iconSize: [30, 30] });
                const m = L.marker([centerCoord[0] + off.lat, centerCoord[1] + off.lng], { icon: poiIcon }).addTo(map);
                poiMarkers.push(m);
            });
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            // Converts coordinates to bearing angle for car rotation
            const toRad = (deg) => deg * Math.PI / 180;
            const toDeg = (rad) => rad * 180 / Math.PI;
            
            const dLon = toRad(lon2 - lon1);
            const y = Math.sin(dLon) * Math.cos(toRad(lat2));
            const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
            const brng = toDeg(Math.atan2(y, x));
            return (brng + 360) % 360;
        }

        // Bootstrap App
        window.onload = () => {
            initMap();
            initFirebase();
        };
    </script>
